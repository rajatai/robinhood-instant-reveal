name: Build Instant Reveal

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract NFT ZIP
        run: |
          rm -rf metadata
          mkdir -p metadata
          unzip -q Shadow_Realms_3000_JPEG.zip -d extracted

          echo "Isi ZIP:"
          find extracted -maxdepth 2 -type f | head -20

          find extracted -type f -name "*.json" ! -name "collection.json" -exec cp {} metadata/ \;
      - name: Show metadata count
        run: |
          echo "Jumlah metadata:"
          find metadata -maxdepth 1 -type f -name "*.json" | wc -l

      - name: Build manifest
        run: npm run build:manifest

      - name: Typecheck
        run: npm run typecheck
