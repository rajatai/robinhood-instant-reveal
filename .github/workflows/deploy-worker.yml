name: Deploy Instant Reveal

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract NFT ZIP
        run: |
          rm -rf metadata extracted
          mkdir -p metadata
          unzip -q Shadow_Realms_3000_JPEG.zip -d extracted
          find extracted -type f -name "*.json" ! -name "collection.json" -exec cp {} metadata/ \;

      - name: Build manifest
        run: npm run build:manifest

      - name: Deploy to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
